aid: galxe
name: Galxe
description: >-
  Galxe is a decentralized super app and one of web3's largest onchain
  distribution platforms, serving 14M+ Galxe ID users across a product suite of
  Quest, Passport, Score, Compass, and the Galxe Identity Protocol. For
  developers, Galxe exposes a public Integration GraphQL API
  (https://graphigo-business.prd.galaxy.eco/query) to query credentials, quests,
  spaces, loyalty-points leaderboards, and Starboard social metrics, plus a
  Credential API for pushing eligibility data, "Sign in with Galxe" OAuth 2.0 for
  identity, and a TypeScript SDK for the zero-knowledge Galxe Identity Protocol.
  API access uses a dashboard-issued access-token header with per-second rate
  limits and monthly quotas. Originally surfaced as a portfolio company of
  Multicoin Capital and enriched from Galxe's public developer documentation.
